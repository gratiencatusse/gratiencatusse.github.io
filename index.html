<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gratien Catusse | E-portfolio</title>
  <meta name="description" content="E-portfolio de Gratien Catusse : projets, parcours, compétences et contact.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <a href="#welcome" class="logo">Gratien Catusse</a>
    <button id="menu-btn" aria-label="Menu">☰</button>
    <nav id="menu"></nav>
    <button id="theme-btn" aria-label="Changer de thème">◐</button>
  </header>

  <main>
    <section id="welcome" class="hero">
      <div>
        <h1 id="hero-name"></h1>
        <p id="hero-tagline"></p>
        <p class="chips" id="hero-chips"></p>
        <a class="btn" href="#projets">Voir mes projets</a>
        <a class="btn ghost" href="#contact">Me contacter</a>
      </div>
      <img id="hero-photo" alt="Portrait" src="assets/photo.jpg" onerror="this.style.display='none'">
    </section>

    <section id="competences"><h2>Compétences</h2><div class="grid" id="skills"></div></section>
    <section id="projets"><h2>Projets</h2><div class="filters" id="filters"></div><div class="grid" id="projects"></div></section>
    <section id="parcours"><h2>Parcours</h2><div class="timeline" id="career"></div></section>
    <section id="contact">
      <h2>Contact</h2>
      <p id="contact-text"></p>
      <div id="contact-links" class="chips"></div>
    </section>
  </main>

  <footer><span id="year"></span> Gratien Catusse</footer>
  <script src="main.js"></script>
</body>
</html>
